<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aforo Vehicular · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <span class="brand">Aforo Vehicular</span>
    <a href="/" class="active">Dashboard</a>
    <a href="/cameras">Cámaras</a>
    <a href="/lines">Líneas</a>
    <a href="/reports">Reportes</a>
    <a href="/settings">⚙️ Configuración</a>
    <span class="spacer"></span>
    <span class="badge-conn" id="wsState"><span class="status-dot" id="wsDot"></span>Tiempo real</span>
  </nav>

  <div class="container">
    <h1>Dashboard</h1>
    <p class="subtitle">Vista en tiempo real de cámaras activas y conteos del día.</p>

    <div class="dash-grid">
      <div>
        <h2>Totales de hoy</h2>
        <div class="grid grid-stats" id="totals"></div>

        <div class="section-head mt">
          <h2 style="margin:0">Cámaras activas</h2>
        </div>
        <div class="grid grid-cams" id="cameras"></div>
        <div id="noCams" class="card muted hidden">No hay cámaras activas. Ve a la sección <a href="/cameras">Cámaras</a> para agregar una.</div>
      </div>

      <div class="feed-panel">
        <div class="feed-head">
          <h2>Últimos cruces</h2>
          <span class="live-pill"><span class="status-dot on"></span>TIEMPO REAL</span>
        </div>
        <div class="feed-list" id="crossings"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/dashboard.js"></script>
</body>
</html>
